  toc: index.toc
  pdf: _book/Bayes,-Artificial-Intelligence,-and-Deep-Learning.pdf  # the built PDF; its name follows the book title or output-file
  meta: bookmeta.yml   # generated: book-doi, book-version ...; list it under metadata-files in _quarto.yml
macros: misc/preamble.tex        # the file that defines the book's macros
code_dir: code             # empty if the book has no code
environments: {res: Section}      # printed names of id prefixes: res- marks a catalogued statement in a plain div, which Quarto does not number, so the aux holds its section number
